heading: About the Professor
lead: Alireza Jalali is an Associate Professor in the School of Mechanical Engineering at the University of Tehran.
body: His research draws on fluid mechanics, numerical analysis, and system optimization to address problems in
  water treatment and desalination. Published studies address ultraviolet photoreactor design, water disinfection,
  and thermal desalination systems.
education: ''
research_statement: Combining fundamental fluid mechanics with practical purification and desalination challenges.
