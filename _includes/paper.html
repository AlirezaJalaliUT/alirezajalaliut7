<article class="paper-item" data-paper data-year="{{ include.paper.year }}" data-search="{{ include.paper.title | escape }} {{ include.paper.authors | escape }} {{ include.paper.venue | escape }} {{ include.paper.year }}"><div class="paper-year"><span>{{ include.paper.year }}</span></div><div><p class="paper-venue">{{ include.paper.venue | escape }}</p><h3><a href="{{ include.paper.url | relative_url }}">{{ include.paper.title | escape }}</a></h3><p class="paper-authors">{{ include.paper.authors | escape }}</p><div class="paper-actions">{% if include.paper.doi and include.paper.doi != '' %}<a href="https://doi.org/{{ include.paper.doi | escape }}" target="_blank" rel="noopener noreferrer">Paper ↗</a>{% endif %}<a href="{{ include.paper.url | relative_url }}">Details ↗</a></div></div></article>
